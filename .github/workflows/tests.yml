name: SignalBridge tests

# Manual-only: do not run Actions on pull_request or push.
# Local tests provide the PR verification evidence.
on:
  workflow_dispatch:

# Cancel duplicate manually dispatched runs for the same ref.
concurrency:
  group: signalbridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify isolated mock end-to-end workflow
        run: python scripts/verify_offline.py
      - name: Run offline test suite
        env:
          X_ENABLE_READ: 'false'
          X_ENABLE_LIVE_SEND: 'false'
          AI_PROVIDER: template
        run: python -m pytest -q
